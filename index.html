<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المتدربين | فريق اللياقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- شريط التنقل -->
    <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex flex-wrap justify-between items-center max-w-2xl">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-l from-blue-400 to-cyan-300 uppercase tracking-wider flex items-center gap-2">
                <span class="text-blue-500">⚡</span> فريق اللياقة
            </h1>
            
            <button id="mobile-menu-btn" class="md:hidden focus:outline-none p-2 rounded-lg bg-slate-800 text-cyan-400 hover:bg-slate-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <ul id="nav-links" class="hidden md:flex w-full md:w-auto flex-col md:flex-row mt-4 md:mt-0 space-y-2 md:space-y-0 md:space-x-2 md:space-x-reverse font-bold text-sm">
                <li><button id="link-home" class="nav-btn block w-full text-right hover:bg-slate-800 text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-lg transition-all">الرئيسية</button></li>
                <li><button id="link-workouts" class="nav-btn block w-full text-right hover:bg-slate-800 text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-lg transition-all">البرنامج</button></li>
                <li><button id="link-measurements" class="nav-btn block w-full text-right hover:bg-slate-800 text-slate-300 hover:text-cyan-400 px-3 py-2 rounded-lg transition-all">القياسات</button></li>
                <!-- زر دخول المدرب -->
                <li><button id="link-coach" class="nav-btn block w-full text-right bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500 hover:text-slate-900 px-3 py-2 rounded-lg transition-all border border-cyan-500/30">المدرب 🛡️</button></li>
            </ul>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4 max-w-2xl">
        
        <!-- نموذج التسجيل -->
        <div id="registration-form" class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 md:p-8 mb-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
            <h2 class="text-2xl font-black mb-6 text-white flex items-center gap-2">
                <span class="text-cyan-400">📝</span> تسجيل بطل جديد
            </h2>
            <form id="profile-form" class="space-y-5 relative z-10">
                <div>
                    <label class="block mb-1 text-sm font-semibold text-slate-400">الاسم الكامل</label>
                    <input type="text" id="user-name" class="bg-slate-900 border border-slate-700 text-white p-3 rounded-xl w-full focus:ring-2 focus:ring-cyan-500 outline-none transition">
                </div>
                <div>
                    <label class="block mb-1 text-sm font-semibold text-slate-400">رقم الهاتف</label>
                    <input type="tel" id="user-phone" class="bg-slate-900 border border-slate-700 text-white p-3 rounded-xl w-full focus:ring-2 focus:ring-cyan-500 outline-none transition">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block mb-1 text-sm font-semibold text-slate-400">الوزن (كغ)</label>
                        <input type="number" id="user-weight" class="bg-slate-900 border border-slate-700 text-white p-3 rounded-xl w-full focus:ring-2 focus:ring-cyan-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block mb-1 text-sm font-semibold text-slate-400">تاريخ البدء</label>
                        <input type="date" id="start-date" class="bg-slate-900 border border-slate-700 text-slate-300 p-3 rounded-xl w-full focus:ring-2 focus:ring-cyan-500 outline-none transition">
                    </div>
                </div>
                <button type="button" id="save-btn" class="bg-gradient-to-r from-blue-600 to-cyan-500 text-white px-6 py-4 rounded-xl hover:from-blue-500 hover:to-cyan-400 transition-all w-full font-black text-lg mt-4">تسجيل وانطلاق 🚀</button>
            </form>
        </div>

        <div id="main-content" class="hidden space-y-8">
            
            <!-- صفحة المتدرب (البطاقة الرئيسية) -->
            <div id="page-home" class="page-section">
                <!-- (نفس كود البطاقة الرياضية السابق بدون تغيير) -->
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl shadow-2xl border border-slate-700 p-6 md:p-8 relative overflow-hidden flex flex-col items-center">
                    <div class="relative z-10 flex flex-col items-center mb-8 mt-4">
                        <h2 id="display-name" class="text-3xl md:text-4xl font-black text-white tracking-wide mb-1 uppercase drop-shadow-md">الاسم</h2>
                        <p class="text-cyan-400 font-bold tracking-widest text-sm">عضو الفريق 🏆</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4 w-full relative z-10 mb-4">
                        <div class="bg-slate-900/60 rounded-2xl p-4 md:p-5 border border-slate-700/50 flex flex-col items-center">
                            <span class="text-slate-400 text-xs font-bold mb-2">الوزن الحالي</span>
                            <div class="flex items-baseline gap-1">
                                <span id="display-weight" class="text-3xl font-black text-white">---</span><span class="text-sm font-bold text-cyan-500">كغ</span>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 rounded-2xl p-4 md:p-5 border border-slate-700/50 flex flex-col items-center">
                            <span class="text-slate-400 text-xs font-bold mb-2">تاريخ الانضمام</span>
                            <span id="display-date" class="text-xl font-black text-white mt-1">---</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- صفحة التمارين -->
            <div id="page-workouts" class="page-section hidden">
                <div class="bg-slate-800 rounded-3xl border border-slate-700 p-6">
                    <h3 class="text-xl font-black border-b border-slate-700 pb-4 mb-6 text-white flex items-center gap-3">
                        <span class="bg-cyan-500/20 text-cyan-400 p-2 rounded-lg">📅</span> البرنامج الأسبوعي
                    </h3>
                    <ul id="workout-list" class="space-y-4">
                        <li class="workout-card flex justify-between items-center bg-slate-900 border border-slate-700 p-5 rounded-2xl">
                            <div><span class="font-bold text-white block text-lg mb-1">الأحد: سيركوي</span><span class="text-sm text-cyan-400">⏱️ 18:00</span></div>
                            <button class="complete-btn bg-green-500 text-slate-900 px-6 py-2.5 rounded-xl font-black">إتمام</button>
                        </li>
                        <li class="workout-card flex justify-between items-center bg-slate-900 border border-slate-700 p-5 rounded-2xl">
                            <div><span class="font-bold text-white block text-lg mb-1">الثلاثاء: بطن</span><span class="text-sm text-cyan-400">⏱️ 18:00</span></div>
                            <button class="complete-btn bg-green-500 text-slate-900 px-6 py-2.5 rounded-xl font-black">إتمام</button>
                        </li>
                        <li class="workout-card flex justify-between items-center bg-slate-900 border border-slate-700 p-5 rounded-2xl">
                            <div><span class="font-bold text-white block text-lg mb-1">الخميس: أرجل</span><span class="text-sm text-cyan-400">⏱️ 18:00</span></div>
                            <button class="complete-btn bg-green-500 text-slate-900 px-6 py-2.5 rounded-xl font-black">إتمام</button>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- صفحة القياسات -->
            <div id="page-measurements" class="page-section hidden">
                <div class="bg-slate-800 rounded-3xl border border-slate-700 p-6">
                    <h3 class="text-xl font-black mb-3 text-white">📏 تحديث الميزان</h3>
                    <div class="flex gap-3 mt-4">
                        <input type="number" id="new-weight-input" placeholder="الوزن الجديد (كغ)" class="bg-slate-900 border border-slate-700 text-white p-4 rounded-xl w-full">
                        <button id="save-new-weight-btn" class="bg-cyan-500 text-slate-900 px-8 py-4 rounded-xl font-black">تحديث</button>
                    </div>
                </div>
            </div>

            <!-- ================= 3. صفحة المدرب (الجديدة) ================= -->
            <div id="page-coach" class="page-section hidden">
                <!-- بطاقة الإحصائيات -->
                <div class="bg-gradient-to-r from-cyan-600 to-blue-700 rounded-3xl shadow-xl p-6 md:p-8 mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-black text-white mb-1">🛡️ لوحة المدرب</h2>
                        <p class="text-cyan-200 font-semibold text-sm">إدارة أبطال الفريق</p>
                    </div>
                    <div class="text-center bg-slate-900/30 p-4 rounded-2xl backdrop-blur-sm border border-white/10">
                        <span class="block text-slate-200 text-xs font-bold mb-1">إجمالي المتدربين</span>
                        <span id="total-trainees-count" class="text-4xl font-black text-white">0</span>
                    </div>
                </div>

                <!-- قائمة المتدربين -->
                <div class="bg-slate-800 rounded-3xl border border-slate-700 p-6">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                        <h3 class="text-lg font-black text-white">قائمة الأبطال</h3>
                        <button id="add-new-trainee-btn" class="text-sm bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-bold transition">➕ إضافة متدرب</button>
                    </div>
                    <div id="trainees-list-container" class="space-y-3">
                        <!-- سيتم حقن المتدربين هنا عبر الجافاسكريبت -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
