<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المتدربين | فريق اللياقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- شريط التنقل -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex flex-wrap justify-between items-center">
            <h1 class="text-2xl font-bold">💪 منصة المتدربين</h1>
            
            <button id="mobile-menu-btn" class="md:hidden focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <ul id="nav-links" class="hidden md:flex w-full md:w-auto flex-col md:flex-row mt-4 md:mt-0 space-y-2 md:space-y-0 md:space-x-4 md:space-x-reverse">
                <li><a href="#" class="block hover:bg-blue-700 px-2 py-1 rounded transition">الرئيسية</a></li>
                <li><a href="#" class="block hover:bg-blue-700 px-2 py-1 rounded transition">جدول التمارين</a></li>
                <li><a href="#" class="block hover:bg-blue-700 px-2 py-1 rounded transition">القياسات</a></li>
            </ul>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto mt-6 p-4">
        
        <!-- قسم إدخال بيانات المتدرب -->
        <div id="registration-form" class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">📝 إعداد الملف الشخصي</h2>
            <form id="profile-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="user-name" placeholder="الاسم الكامل" class="border p-2 rounded w-full focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="tel" id="user-phone" placeholder="رقم الهاتف" class="border p-2 rounded w-full focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="number" id="user-weight" placeholder="الوزن الحالي (كغ)" class="border p-2 rounded w-full focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="date" id="start-date" class="border p-2 rounded w-full focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block mb-2 text-gray-700 font-semibold">صورة شخصية (اختياري)</label>
                    <input type="file" id="user-image" accept="image/*" class="border p-2 rounded w-full">
                </div>
                <button type="button" id="save-btn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition w-full font-bold">حفظ البيانات والانطلاق 🚀</button>
            </form>
        </div>

        <!-- بطاقة الملف الشخصي -->
        <div id="profile-card" class="bg-white rounded-lg shadow p-6 mb-6 hidden flex flex-col sm:flex-row items-center gap-4">
            <img id="display-image" src="https://via.placeholder.com/100" alt="صورة المتدرب" class="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-sm">
            <div class="text-center sm:text-right">
                <h2 id="display-name" class="text-2xl font-bold text-gray-800">الاسم</h2>
                <p class="text-gray-600">📱 الهاتف: <span id="display-phone">---</span></p>
                <p class="text-gray-600">⚖️ الوزن المبدئي: <span id="display-weight">---</span> كغ</p>
                <p class="text-gray-600">📅 يوم البدء: <span id="display-date">---</span></p>
                <button id="edit-profile-btn" class="mt-2 text-sm text-blue-600 hover:underline">تعديل البيانات</button>
            </div>
        </div>

        <!-- قسم التمارين -->
        <div id="workouts-section" class="bg-white rounded-lg shadow p-6 hidden">
            <h3 class="text-lg font-bold border-b pb-2 mb-4">🏋️ تمارين اليوم (الجزء العلوي)</h3>
            <ul id="workout-list" class="space-y-3">
                <li class="flex flex-col sm:flex-row justify-between sm:items-center bg-gray-100 p-4 rounded gap-3">
                    <span>ضغط الصدر (Bench Press) - 3 جولات / 10 تكرارات</span>
                    <button class="complete-btn bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 w-full sm:w-auto">إتمام</button>
                </li>
                <li class="flex flex-col sm:flex-row justify-between sm:items-center bg-gray-100 p-4 rounded gap-3">
                    <span>سحب الظهر (Lat Pulldown) - 3 جولات / 12 تكرار</span>
                    <button class="complete-btn bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 w-full sm:w-auto">إتمام</button>
                </li>
            </ul>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
