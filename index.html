<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المتدربين | فريق اللياقة</title>
    <!-- استدعاء مكتبة Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- شريط التنقل -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">💪 منصة المتدربين</h1>
            <ul class="flex space-x-4 space-x-reverse">
                <li><a href="#" class="hover:text-blue-200">الرئيسية</a></li>
                <li><a href="#" class="hover:text-blue-200">جدول التمارين</a></li>
                <li><a href="#" class="hover:text-blue-200">القياسات</a></li>
            </ul>
        </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto mt-8 p-4">
        
        <!-- بطاقة الترحيب -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-2">أهلاً بك، يا بطل! 🚀</h2>
            <p class="text-gray-600">حصتك القادمة تبدأ اليوم في الساعة 5:00 مساءً. استعد!</p>
        </div>

        <!-- جدول تمارين اليوم -->
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-bold border-b pb-2 mb-4">🏋️ تمارين اليوم (الجزء العلوي)</h3>
            
            <ul id="workout-list" class="space-y-3">
                <li class="flex justify-between items-center bg-gray-100 p-3 rounded">
                    <span>ضغط الصدر (Bench Press) - 3 جولات / 10 تكرارات</span>
                    <button class="complete-btn bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">إتمام</button>
                </li>
                <li class="flex justify-between items-center bg-gray-100 p-3 rounded">
                    <span>سحب الظهر (Lat Pulldown) - 3 جولات / 12 تكرار</span>
                    <button class="complete-btn bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">إتمام</button>
                </li>
            </ul>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
